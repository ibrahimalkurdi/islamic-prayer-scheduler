# Installed by scheduler-apply-system. IPv6 off: the ISP rotates the delegated prefix
# several times a day and avahi follows it late, so <hostname>.local could answer with a
# stale address, or clash with its own old record and rename itself <hostname>-2.local.
# Every device is reached by its IPv4 address or its .local name, never by IPv6.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
