<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face { font-family: AmiriC; src: local("Amiri"), local("Amiri Regular"); }

.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20mm; }
.icon { width: 64mm; border-radius: 14mm; box-shadow: 0 0 60px rgba(250,200,90,.35), 0 10px 30px rgba(0,0,0,.6); }
h1 { font-size: 46pt; font-weight: 700; margin-top: 16mm; }
.rule { width: 60mm; height: 2px; background: linear-gradient(90deg, transparent, #C9A24B, transparent); margin: 8mm 0; }
h2 { font-size: 24pt; font-weight: 400; color: #E7D39B; }
.foot { position: absolute; bottom: 18mm; left: 0; right: 0; text-align: center; color: #94A3B8; font-size: 13pt; }
</style></head><body><div class="pat"></div><div class="wrap">
