<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face { font-family: AmiriC; src: local("Amiri"), local("Amiri Regular"); }
@font-face { font-family: AmiriC; src: local("Amiri Bold"); font-weight: 700; }
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 210mm; height: 297mm; overflow: hidden; }
body { position: relative; font-family: AmiriC, serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #0F172A; }
.photo { position: absolute; top: -40mm; left: -2mm; width: 214mm; }
.title { position: absolute; top: 16mm; left: 10mm; width: 104mm; text-align: right; color: #0F172A; }
.title .mark { display: inline-flex; flex-direction: column; }
.title .lockup { display: flex; align-items: center; gap: 5mm; }
.title .logo { width: 24mm; height: 24mm; border-radius: 5.5mm; box-shadow: 0 2px 10px rgba(15,23,42,.25); }
.title .brand { font-size: 50pt; font-weight: 700; line-height: 1; color: #0F172A; padding-top: 3mm; }
.title .rule { align-self: stretch; height: 1.4mm; margin: 6mm 0 5mm; background: #B8923A; border-radius: 1mm; }
.title h1 { font-size: 30pt; font-weight: 700; line-height: 1.25; color: #1E293B; }
.title h2 { font-size: 17pt; font-weight: 400; line-height: 1.5; color: #475569; margin-top: 4mm; }
.band { position: absolute; left: -1mm; right: -1mm; bottom: -1mm; height: 92mm; background: linear-gradient(180deg, rgba(15,23,42,0) 0%, rgba(15,23,42,.85) 22%, #0F172A 38%); }
.setup { position: absolute; left: 16mm; right: 16mm; bottom: 16mm; display: flex; align-items: center; gap: 9mm; color: #fff; }
.code { flex: none; background: #fff; padding: 2mm; border-radius: 4mm; line-height: 0; }
.code svg { display: block; width: 40mm; height: 40mm; }
.text h3 { font-size: 18pt; font-weight: 700; }
.text .url { direction: ltr; text-align: right; font-family: "DejaVu Sans Mono", monospace; font-size: 12pt; color: #E7D39B; margin: 1mm 0 2mm; }
.text p { font-size: 13pt; line-height: 1.6; color: #CBD5E1; }
.date { position: absolute; bottom: 6mm; left: 0; right: 0; text-align: center; color: #94A3B8; font-size: 11pt; }
</style></head><body>
<img class="photo" src="../../tools/manual_pdf/cover-photo.jpg">
<div class="title">
<div class="mark"><div class="lockup"><img class="logo" src="../../scheduler-official-touch-screen-with-raspberry-pi-4/config/icons/athan-app-icon-256.png"><div class="brand">السكينة</div></div>
<div class="rule"></div></div>
<h1>دليل المستخدم</h1>
<h2>نظام مواقيت الصلاة والأذان</h2>
</div>
<div class="band"></div>
{{SETUP}}
<div class="date">{{DATE}}</div>
</body></html>
